[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secureflow"
version = "0.1.0"
description = "Security platform for analyzing software projects and CI/CD pipelines"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Ali Cokovali", email = "cokovali10@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
    "regex>=2023.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "bandit>=1.7",
]
scanners = [
    "bandit>=1.7",
    "pip-audit>=2.7",
    "trivy>=0.50",
]
all = [
    "secureflow[dev,scanners]",
]

[project.scripts]
secureflow = "secureflow.cli.main:main"

[project.urls]
Homepage = "https://github.com/cokovali10-sketch/SecureFlow"
Repository = "https://github.com/cokovali10-sketch/SecureFlow"
Issues = "https://github.com/cokovali10-sketch/SecureFlow/issues"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "T20", "SIM", "RUF"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
"secureflow/cli/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "security: Security tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["secureflow"]
omit = ["tests/*", "secureflow/api/*"]

[tool.coverage.report]
show_missing = true
fail_under = 60
